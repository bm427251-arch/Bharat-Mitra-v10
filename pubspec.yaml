name: bharat_mitra
description: "Bharat Mitra V10 - Zero Commission Ride & Home Services Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  easy_localization: ^3.0.8
  shared_preferences: ^2.2.2
  flutter_animate: ^4.5.0
  url_launcher: ^6.3.0
  geolocator: ^11.0.0
  geocoding: ^3.0.0
  google_maps_flutter: ^2.5.0
  image_picker: ^1.1.0
  firebase_core: ^2.30.0
  firebase_auth: ^4.19.0
  cloud_firestore: ^4.17.0
  firebase_storage: ^11.7.0
  lottie: ^3.1.2
  fl_chart: ^0.68.0
  mappls_gl: ^1.0.3
  mappls_place_widget: ^1.0.1
  flutter_image_compress: ^2.3.0
  path_provider: ^2.1.3
  video_player: ^2.8.6

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/translations/
    - assets/lottie/
    - assets/icons/
